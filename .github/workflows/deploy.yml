name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      client:
        description: "Client slug (content/clients/<slug>.json)"
        required: false
        default: ""
      base_path:
        description: "Base path served on Pages, e.g. /hairmann"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        # Which client ships is controlled by (in priority order): the
        # workflow_dispatch inputs, repo variables CLIENT / BASE_PATH, else
        # the barber-021 default. Pages serves one site per repo — to ship a
        # different client, set the repo variables or run the workflow manually.
        env:
          NEXT_PUBLIC_CLIENT: ${{ github.event.inputs.client || vars.CLIENT || 'barber-021' }}
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.inputs.base_path || vars.BASE_PATH || '/barber-021' }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
